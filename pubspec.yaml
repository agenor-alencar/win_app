name: win_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Rede: dio com interceptors (Bearer automático, refresh no 401, retry, log só em debug).
  dio: ^5.7.0
  # Armazenamento seguro de token/refresh/PII (Keychain/Keystore) — substitui o
  # shared_preferences para dados sensíveis.
  flutter_secure_storage: ^9.2.2
  # Preferências NÃO sensíveis (ex.: tema).
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  device_frame: ^1.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
