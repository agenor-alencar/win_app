name: PR Tests

# Gate de qualidade do app Flutter (win_app), espelhando o pr-tests.yml do
# repositório backend (win): roda análise estática, testes e um build ANTES do
# merge, para não deixar código que não compila/quebra teste chegar à main.
#
# Também roda em push para a main (o app historicamente era enviado direto à
# main) — assim nada passa sem verificação enquanto migramos para o fluxo de PR.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# Cancela execuções antigas do mesmo ref quando chega um novo commit.
concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-tests:
    name: Flutter (analyze + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Necessário para o build Android (Gradle/AGP). O runner ubuntu-latest já
      # traz o Android SDK; aqui fixamos apenas o JDK para o Gradle.
      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Flutter (canal stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      # Análise estática. Hoje o projeto tem infos pré-existentes (depreciações
      # withOpacity, use_build_context_synchronously, etc.) — 0 erros, 0 warnings.
      # Mantemos advisory (não trava o merge) até zerar essa dívida; depois é só
      # remover o continue-on-error para virar gate estrito.
      - name: Análise estática (flutter analyze)
        continue-on-error: true
        run: flutter analyze

      - name: Rodar testes
        run: flutter test

      # Build de verdade pega erros que analyze/testes não pegam (ex.: falha de
      # compilação nativa). APK debug é o artefato representativo do app mobile.
      - name: Build (APK debug)
        run: flutter build apk --debug
